<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بث المباريات المباشر</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family:'Segoe UI',Tahoma; background:#0d1117; color:#fff; margin:0; padding:20px; text-align:center; }
  h1 { color:#00d4ff; }
  video { width:100%; max-width:900px; border-radius:12px; background:#000; min-height:400px; }
  .channels { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; max-width:900px; margin:20px auto; }
  .chan { background:#161b22; border:2px solid #30363d; border-radius:10px; padding:14px; cursor:pointer; transition:.2s; }
  .chan:hover, .chan.active { border-color:#00d4ff; background:#1c2530; }
  .chan h3 { margin:0 0 6px; font-size:16px; }
  .live-dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:red; animation:pulse 1s infinite; }
  @keyframes pulse { 50% { opacity:.4; } }
  #status { color:#ff6b6b; margin-top:10px; min-height:20px; }
</style>
</head>
<body>
<h1>⚽ بث المباريات المباشر</h1>
<video id="player" controls autoplay></video>
<div id="status"></div>
<div class="channels" id="list"></div>

<script>
const channels = [
  "beIN SPORTS 1", "beIN SPORTS 2", "beIN SPORTS 3",
  "beIN SPORTS 4", "beIN SPORTS 5", "beIN SPORTS 6",
];

const video = document.getElementById('player');
const status = document.getElementById('status');
const list = document.getElementById('list');
let hls = null;

function play(id, btn) {
  document.querySelectorAll('.chan').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  status.textContent = '⏳ جاري التحميل...';
  if (hls) hls.destroy();
  hls = new Hls();
  hls.loadSource('/stream/' + id);
  hls.attachMedia(video);
  hls.on(Hls.Events.MANIFEST_PARSED, () => { status.textContent = ''; video.play(); });
  hls.on(Hls.Events.ERROR, (e, data) => {
    if (data.fatal) {
      if (data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
      else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
      else status.textContent = '❌ خطأ في البث، جرب قناة أخرى';
    }
  });
}

channels.forEach((name, i) => {
  const btn = document.createElement('div');
  btn.className = 'chan';
  btn.innerHTML = `<h3>${name}</h3><span class="live-dot"></span> بث مباشر`;
  btn.onclick = () => play(i + 1, btn);
  list.appendChild(btn);
});

play(1, list.children[0]);
</script>
</body>
</html>
